{{define "content"}}
<h1>{{if .Editing}}Editar produto{{else}}Novo produto{{end}}</h1>

{{if .Error}}<div class="error-banner">{{.Error}}</div>{{end}}

<div class="panel">
<form method="post" action="{{.Action}}" class="stack">
<div class="grid">
<div>
<label for="name">Nome *</label>
<input type="text" id="name" name="name" value="{{.Name}}" required>
</div>
<div>
<label for="unit_price">Preço unitário (R$) *</label>
<input type="text" id="unit_price" name="unit_price" value="{{.Price}}" placeholder="1500,00" required>
<p class="hint">Use vírgula como separador decimal, ex.: 1500,00.</p>
</div>
<div class="wide">
<label for="description">Descrição</label>
<textarea id="description" name="description">{{.Description}}</textarea>
</div>
{{if .Editing}}
<div class="wide">
<label>
<input type="checkbox" name="active" {{if .Active}}checked{{end}}> Produto ativo
</label>
</div>
{{end}}
</div>
<div class="actions">
<button type="submit">Salvar</button>
<a class="btn btn-secondary" href="/produtos">Cancelar</a>
</div>
</form>
</div>
{{end}}
