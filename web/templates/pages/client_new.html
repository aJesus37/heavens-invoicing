{{define "content"}}
<h1>{{T "clients.new"}}</h1>

{{if .Error}}<div class="error-banner">{{.Error}}</div>{{end}}

<div class="panel">
<form method="post" action="/clients/new" class="stack">
{{template "csrfField" .}}
<div class="grid">
<div class="wide">
<label for="name">{{T "label.name"}} *</label>
<input type="text" id="name" name="name" value="{{.Name}}" required>
</div>
<div>
<label for="email">{{T "label.email"}}</label>
<input type="email" id="email" name="email" value="{{.Email}}">
</div>
<div>
<label for="phone">{{T "label.phone_whatsapp"}}</label>
<input type="text" id="phone" name="phone" value="{{.Phone}}" placeholder="+5511999999999">
</div>
<div>
<label for="telegram_chat_id">{{T "label.telegram_chat_id"}}</label>
<input type="text" id="telegram_chat_id" name="telegram_chat_id" value="{{.TelegramChatID}}">
</div>
<div>
<label for="pix_key">{{T "label.pix_key"}}</label>
<input type="text" id="pix_key" name="pix_key" value="{{.PIXKey}}">
</div>
<div>
<label for="language">{{T "field.locale"}}</label>
<select id="language" name="language">
<option value="pt-BR" {{if ne .Language "en"}}selected{{end}}>{{T "locale.pt-BR"}}</option>
<option value="en" {{if eq .Language "en"}}selected{{end}}>{{T "locale.en"}}</option>
</select>
</div>
<div class="wide">
<label for="address">{{T "label.address"}}</label>
<textarea id="address" name="address">{{.Address}}</textarea>
</div>
<div class="wide">
<label for="notes">{{T "label.notes"}}</label>
<textarea id="notes" name="notes">{{.Notes}}</textarea>
</div>
</div>
<div class="actions">
<button type="submit">{{T "button.save"}}</button>
<a class="btn btn-secondary" href="/clients">{{T "button.cancel"}}</a>
</div>
</form>
</div>
{{end}}
