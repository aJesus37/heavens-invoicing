{{define "content"}}
<h1>Nova recorrência</h1>

{{if .Error}}<div class="error-banner">{{.Error}}</div>{{end}}

<div class="panel">
<form method="post" action="/recorrentes/novo" class="stack">
<div class="grid">
<div>
<label for="client_id">Cliente *</label>
<select id="client_id" name="client_id" required>
{{range .Clients}}
<option value="{{.Value}}" {{if .Selected}}selected{{end}}>{{.Label}}</option>
{{end}}
</select>
</div>
<div class="wide">
<label for="invoice_template_id">Fatura modelo (rascunhos) *</label>
<select id="invoice_template_id" name="invoice_template_id" required>
{{range .Templates}}
<option value="{{.Value}}" {{if .Selected}}selected{{end}}>{{.Label}}</option>
{{end}}
</select>
<p class="hint">A cada disparo o agendador clona este rascunho com nova numeração e datas.</p>
</div>
<div>
<label for="frequency">Frequência *</label>
<select id="frequency" name="frequency" required>
{{range .Frequency}}
<option value="{{.Value}}" {{if .Selected}}selected{{end}}>{{.Label}}</option>
{{end}}
</select>
</div>
<div>
<label for="delivery_method">Método de entrega *</label>
<select id="delivery_method" name="delivery_method" required>
{{range .Methods}}
<option value="{{.Value}}" {{if .Selected}}selected{{end}}>{{.Label}}</option>
{{end}}
</select>
</div>
<div>
<label for="next_send_date">Próximo envio *</label>
<input type="date" id="next_send_date" name="next_send_date" value="{{.NextDate}}" required>
</div>
</div>

<div class="actions">
<button type="submit">Criar recorrência</button>
<a class="btn btn-secondary" href="/recorrentes">Cancelar</a>
</div>
</form>
</div>
{{end}}
