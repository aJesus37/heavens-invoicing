{{define "content"}}
<h1>Novo cliente</h1>

{{if .Error}}<div class="error-banner">{{.Error}}</div>{{end}}

<div class="panel">
<form method="post" action="/clientes/novo" class="stack">
<div class="grid">
<div class="wide">
<label for="name">Nome *</label>
<input type="text" id="name" name="name" value="{{.Name}}" required>
</div>
<div>
<label for="email">E-mail</label>
<input type="email" id="email" name="email" value="{{.Email}}">
</div>
<div>
<label for="phone">Telefone (WhatsApp)</label>
<input type="text" id="phone" name="phone" value="{{.Phone}}" placeholder="+5511999999999">
</div>
<div>
<label for="telegram_chat_id">Chat ID do Telegram</label>
<input type="text" id="telegram_chat_id" name="telegram_chat_id" value="{{.TelegramChatID}}">
</div>
<div>
<label for="pix_key">Chave PIX</label>
<input type="text" id="pix_key" name="pix_key" value="{{.PIXKey}}">
</div>
<div class="wide">
<label for="address">Endereço</label>
<textarea id="address" name="address">{{.Address}}</textarea>
</div>
<div class="wide">
<label for="notes">Observações</label>
<textarea id="notes" name="notes">{{.Notes}}</textarea>
</div>
</div>
<div class="actions">
<button type="submit">Salvar</button>
<a class="btn btn-secondary" href="/clientes">Cancelar</a>
</div>
</form>
</div>
{{end}}
