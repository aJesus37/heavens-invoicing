{{define "content"}}
<h1>{{T "recurring.new"}}</h1>

{{if .Error}}<div class="error-banner">{{.Error}}</div>{{end}}

<div class="panel">
<form method="post" action="/recurring/new" class="stack">
{{template "csrfField" .}}
<div class="grid">
<div>
<label for="client_id">{{T "label.client"}} *</label>
<select id="client_id" name="client_id" required>
{{range .Clients}}
<option value="{{.Value}}" {{if .Selected}}selected{{end}}>{{.Label}}</option>
{{end}}
</select>
</div>
<div class="wide">
<label for="invoice_template_id">{{T "label.template_invoice"}} *</label>
<select id="invoice_template_id" name="invoice_template_id" required>
{{range .Templates}}
<option value="{{.Value}}" {{if .Selected}}selected{{end}}>{{.Label}}</option>
{{end}}
</select>
<p class="hint">{{T "hint.recurring_template"}}</p>
{{if eq (len .Templates) 1}}<p class="hint">{{THTML "hint.no_drafts_link"}}</p>{{end}}
</div>
<div>
<label for="frequency">{{T "label.frequency"}} *</label>
<select id="frequency" name="frequency" required>
{{range .Frequency}}
<option value="{{.Value}}" {{if .Selected}}selected{{end}}>{{.Label}}</option>
{{end}}
</select>
</div>
<div>
<label for="delivery_method">{{T "label.delivery_method"}} *</label>
<select id="delivery_method" name="delivery_method" required>
{{range .Methods}}
<option value="{{.Value}}" {{if .Selected}}selected{{end}}>{{.Label}}</option>
{{end}}
</select>
</div>
<div>
<label for="next_send_date">{{T "label.next_send"}} *</label>
<input type="date" id="next_send_date" name="next_send_date" value="{{.NextDate}}" required>
</div>
</div>

<div class="actions">
<button type="submit">{{T "button.create_recurring"}}</button>
<a class="btn btn-secondary" href="/recurring">{{T "button.cancel"}}</a>
</div>
</form>
</div>
{{end}}
