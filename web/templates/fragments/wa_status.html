{{if not .Enabled}}
<p class="muted">{{T "wa.unavailable"}}</p>
{{else if eq .State "connected"}}
<p style="color:#1a7f37;">{{T "wa.connected"}}</p>
{{else if eq .State "pairing"}}
<img class="qr-img" src="{{.QRPath}}" alt="{{T "wa.qr_alt"}}" width="256" height="256">
<p>{{T "wa.pairing_wait"}} <span class="muted">{{T "wa.pairing_hint"}}</span></p>
{{else if eq .State "failed"}}
<p style="color:#c0392b;">{{T "wa.failed" .ErrMsg}}</p>
<button hx-post="/configuracoes/whatsapp/conectar"
        hx-target="#wa-status"
        hx-swap="innerHTML">{{T "wa.retry"}}</button>
{{else}}
<p>{{T "wa.disconnected"}}</p>
<button hx-post="/configuracoes/whatsapp/conectar"
        hx-target="#wa-status"
        hx-swap="innerHTML">{{T "wa.generate_qr"}}</button>
{{end}}
