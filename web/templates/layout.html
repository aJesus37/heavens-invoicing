<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · {{T "app.name"}}</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
{{if .CSRFToken}}<meta name="csrf-token" content="{{.CSRFToken}}">{{end}}
<script>
// Every htmx request carries the double-submit CSRF token as a header. The
// value lives in a non-HttpOnly cookie (set by the auth layer) so same-
// origin JS can read it here; classic form posts send the same value via a
// hidden csrf_token field, and the gate accepts either.
document.addEventListener('htmx:config-request', function (evt) {
  var meta = document.querySelector('meta[name="csrf-token"]');
  if (meta) { evt.detail.headers['X-CSRF-Token'] = meta.getAttribute('content'); }
});
</script>
</head>
<body>
<header class="topbar">
<div class="topbar-inner">
<a href="/" class="topbar-brand" aria-label="Heaven's Invoicing">
<img src="/static/logo.svg" alt="" width="28" height="28">
<span>Heaven's Invoicing</span>
</a>
<nav aria-label="{{T "nav.aria"}}">
<a href="/">{{T "nav.dashboard"}}</a>
<a href="/clients">{{T "nav.clients"}}</a>
<a href="/products">{{T "nav.products"}}</a>
<a href="/invoices">{{T "nav.invoices"}}</a>
<a href="/recurring">{{T "nav.recurring"}}</a>
<a href="/settings">{{T "nav.settings"}}</a>
</nav>
<div class="topbar-actions">
<button id="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">🌙</button>
{{if .Authed}}
<form method="post" action="/logout" class="nav-logout">
{{template "csrfField" .}}
<button type="submit">{{T "nav.logout"}}</button>
</form>
{{end}}
</div>
</div>
</header>
<script>
(function(){
  const key="theme";
  const btn=document.getElementById("theme-toggle");
  function apply(t){
    document.documentElement.setAttribute("data-theme",t);
    if(btn) btn.textContent=t==="dark"?"☀️":"🌙";
  }
  let saved=null;
  try{ saved=localStorage.getItem(key); }catch(e){}
  let theme=saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  apply(theme);
  if(btn) btn.addEventListener("click",function(){
    theme=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
    try{ localStorage.setItem(key,theme); }catch(e){}
    apply(theme);
  });
})();
</script>
<main>
{{block "content" .Data}}<p>{{T "dash.empty_recent"}}</p>{{end}}
</main>
</body>
</html>
