version: "3"

tasks:
  build:
    desc: Build the invoice-app binary to ./bin/invoice-app
    cmds:
      - go build -o ./bin/invoice-app .

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test-race:
    desc: Run all tests with the race detector enabled
    cmds:
      - go test -race ./...

  vet:
    desc: Run go vet across the module
    cmds:
      - go vet ./...

  run:
    desc: Run the app locally (listens on $PORT, default 8080)
    cmds:
      - go run .

  docker:build:
    desc: Build the Docker image (invoice-app:local)
    cmds:
      - docker build -t invoice-app:local .

  docker:up:
    desc: Start the stack with docker compose
    cmds:
      - docker compose up -d

  docker:down:
    desc: Stop the stack
    cmds:
      - docker compose down

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf ./bin
