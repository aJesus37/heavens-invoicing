services:
  invoice-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: invoice-app:local
    container_name: invoice-app
    ports:
      - "${PORT:-8010}:8010"
    environment:
      # PORT is read by the app (defaults to 8080 if unset; 8010 in prod).
      PORT: "${PORT:-8010}"
    volumes:
      # Reuse the existing named volume that already holds the live database
      # at /data/data/app.db (container WORKDIR is /data, app stores ./data).
      - invoice-app-data:/data
    restart: unless-stopped
    # The scratch image has no probe binary, so an in-container healthcheck is
    # omitted. The app exposes GET /healthz for external monitoring.

volumes:
  # External: the volume already exists on the host (created by the earlier
  # manual deployment) and must not be re-created/renamed by compose.
  invoice-app-data:
    external: true
